# Unofficial fork: sync the upstream release version and build the full binary.
#
# This workflow is the fork's counterpart to upstream's release pipeline. It
# polls the upstream repository for a new release, records that exact version
# in this fork (a branch + a tag at the upstream commit), builds ZeroClaw with
# the full feature set — including the channels the official `dist` artifacts
# leave out, such as `channel-qq` — and publishes the result as a release in
# this fork.
#
# Why a fork-local pipeline instead of the upstream one: upstream's
# `release-stable-manual.yml` builds the `dist` selection, which excludes the
# `channels-full` aggregate. The official binaries therefore do not contain the
# QQ channel. The `all` selection used here resolves to the same feature set
# as upstream's `:all-features` container image.
#
# Tag naming: releases here are tagged `build-<upstream-tag>` (e.g.
# `build-v0.8.6`). That prefix is deliberate — upstream's `docker-publish.yml`
# and `docs-deploy.yml` trigger on `v*` tags, and `release-stable-manual.yml`
# triggers on `v[0-9]+.[0-9]+.[0-9]+`. A `build-` prefix matches none of them,
# so publishing here cannot accidentally trigger a publish or a docs deploy.
#
# The only files this fork adds on top of upstream are `UNOFFICIAL.md` and this
# workflow. Both are unique paths, so `Sync fork` stays conflict-free.

name: Upstream Sync & Full Build

on:
  schedule:
    # Daily poll. The build only runs when upstream published a version this
    # fork has not built yet, so the cost of an unchanged upstream is one
    # API call.
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream version to build (e.g. v0.8.6). Empty = latest release'
        required: false
        type: string
      selection:
        description: 'Feature selection (all = upstream :all-features image)'
        required: false
        type: choice
        default: all
        options:
          - all
          - dist-broad
      targets:
        description: 'Comma-separated targets. Empty = the default Linux set'
        required: false
        type: string
      force:
        description: 'Rebuild even when a release for this version already exists'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: upstream-sync-full-build
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  UPSTREAM_REPO: zeroclaw-labs/zeroclaw

jobs:
  detect:
    name: Detect upstream release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      upstream_tag: ${{ steps.resolve.outputs.upstream_tag }}
      commit: ${{ steps.resolve.outputs.commit }}
      build_tag: ${{ steps.resolve.outputs.build_tag }}
      needs_build: ${{ steps.check.outputs.needs_build }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      selection: ${{ steps.matrix.outputs.selection }}
    steps:
      - name: Resolve upstream release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "$REQUESTED_VERSION" ]; then
            upstream_tag="$REQUESTED_VERSION"
          else
            upstream_tag=$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq '.tag_name')
          fi

          if [[ ! "$upstream_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Upstream tag '$upstream_tag' is not a stable vX.Y.Z tag."
            exit 2
          fi

          # Release tags may be annotated, so the ref points at a tag object
          # rather than the commit. Peel it to the commit that was built.
          ref=$(gh api "repos/$UPSTREAM_REPO/git/ref/tags/$upstream_tag" --jq '.object.type + " " + .object.sha')
          object_type=${ref%% *}
          sha=${ref##* }
          if [ "$object_type" = "tag" ]; then
            sha=$(gh api "repos/$UPSTREAM_REPO/git/tags/$sha" --jq '.object.sha')
          fi

          version="${upstream_tag#v}"
          build_tag="build-$upstream_tag"

          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$sha" >> "$GITHUB_OUTPUT"
          echo "build_tag=$build_tag" >> "$GITHUB_OUTPUT"

          {
            echo "### Upstream release detected"
            echo
            echo "- Upstream tag: \`$upstream_tag\`"
            echo "- Upstream commit: \`$sha\`"
            echo "- Fork release tag: \`$build_tag\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check whether this version was already built
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TAG: ${{ steps.resolve.outputs.build_tag }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          if [ "$FORCE" = "true" ]; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Force requested — rebuilding $BUILD_TAG."
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$BUILD_TAG" >/dev/null 2>&1; then
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "Release $BUILD_TAG already exists — nothing to do."
          else
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the target matrix
        id: matrix
        env:
          REQUESTED_TARGETS: ${{ inputs.targets }}
          REQUESTED_SELECTION: ${{ inputs.selection || 'all' }}
        run: |
          set -euo pipefail

          selection="$REQUESTED_SELECTION"
          case "$selection" in
            all|dist-broad) ;;
            *) echo "invalid selection '$selection'" >&2; exit 2 ;;
          esac

          # The default set covers the platforms that run the official
          # container: Linux amd64 (GNU and static MUSL) and Linux arm64.
          # macOS and Windows are opt-in via the `targets` input because they
          # need native runners and roughly double the wall-clock cost.
          if [ -n "$REQUESTED_TARGETS" ]; then
            targets="$REQUESTED_TARGETS"
          else
            targets="x86_64-unknown-linux-gnu,x86_64-unknown-linux-musl,aarch64-unknown-linux-gnu"
          fi

          entries='[]'
          IFS=',' read -ra target_list <<< "$targets"
          for target in "${target_list[@]}"; do
            target="${target// /}"
            [ -z "$target" ] && continue
            os=""
            artifact=""
            ext=""
            cross_compiler=""
            linker_env=""
            linker=""
            use_cross="false"
            case "$target" in
              x86_64-unknown-linux-gnu)
                os=ubuntu-22.04; artifact=zeroclaw; ext=tar.gz ;;
              x86_64-unknown-linux-musl)
                os=ubuntu-22.04; artifact=zeroclaw; ext=tar.gz; use_cross=true ;;
              aarch64-unknown-linux-gnu)
                os=ubuntu-22.04; artifact=zeroclaw; ext=tar.gz
                cross_compiler="gcc-aarch64-linux-gnu g++-aarch64-linux-gnu"
                linker_env=CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER
                linker=aarch64-linux-gnu-gcc ;;
              aarch64-unknown-linux-musl)
                os=ubuntu-22.04; artifact=zeroclaw; ext=tar.gz; use_cross=true ;;
              aarch64-apple-darwin)
                os=macos-15; artifact=zeroclaw; ext=tar.gz ;;
              x86_64-apple-darwin)
                os=macos-15-intel; artifact=zeroclaw; ext=tar.gz ;;
              x86_64-pc-windows-msvc)
                os=windows-latest; artifact=zeroclaw.exe; ext=zip ;;
              *)
                echo "::error::Unsupported target '$target'." >&2
                exit 2 ;;
            esac
            entries=$(jq -c \
              --arg target "$target" --arg os "$os" --arg artifact "$artifact" \
              --arg ext "$ext" --arg cross_compiler "$cross_compiler" \
              --arg linker_env "$linker_env" --arg linker "$linker" \
              --arg use_cross "$use_cross" \
              '. + [{target:$target, os:$os, artifact:$artifact, ext:$ext,
                     cross_compiler:$cross_compiler, linker_env:$linker_env,
                     linker:$linker, use_cross:$use_cross}]' <<<"$entries")
          done

          echo "selection=$selection" >> "$GITHUB_OUTPUT"
          echo "matrix={\"include\":$entries}" >> "$GITHUB_OUTPUT"
          echo "Selection: $selection"
          echo "Targets: $targets"

  web:
    name: Build web dashboard
    needs: detect
    if: needs.detect.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Check out the upstream release source
        env:
          UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
          COMMIT: ${{ needs.detect.outputs.commit }}
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git"
          git fetch --depth 1 upstream "$UPSTREAM_TAG"
          # Peel the fetched tag and confirm it is the commit the detect job
          # resolved, so the dashboard is built from exactly the upstream
          # release source and not from whatever the tag happens to point at.
          fetched="$(git rev-parse "FETCH_HEAD^{commit}")"
          if [ "$fetched" != "$COMMIT" ]; then
            echo "::error::Fetched $fetched but expected $COMMIT for $UPSTREAM_TAG"
            exit 1
          fi
          git checkout --detach "$COMMIT"
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web dashboard
        # `cargo web build` is the xtask wrapper that renders the gateway's
        # OpenAPI spec, regenerates the TS client, then runs `npm ci` and the
        # Vite build. A plain `cd web && npm run build` fails on the missing
        # generated import.
        run: cargo web build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  build:
    name: Build ${{ matrix.target }}
    needs: [detect, web]
    if: needs.detect.outputs.needs_build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Check out the upstream release source
        env:
          UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
          COMMIT: ${{ needs.detect.outputs.commit }}
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git"
          git fetch --depth 1 upstream "$UPSTREAM_TAG"
          fetched="$(git rev-parse "FETCH_HEAD^{commit}")"
          if [ "$fetched" != "$COMMIT" ]; then
            echo "::error::Fetched $fetched but expected $COMMIT for $UPSTREAM_TAG"
            exit 1
          fi
          git checkout --detach "$COMMIT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist/
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ${{ matrix.os }}-${{ matrix.target }}-full
      - name: Install cross compiler
        if: matrix.cross_compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ${{ matrix.cross_compiler }}
      - name: Install cross (MUSL targets)
        if: matrix.use_cross
        run: bash scripts/ci/install_release_tool.sh cross
      - name: Prepare bounded Linux ARM64 build memory
        timeout-minutes: 5
        if: runner.os == 'Linux' && (matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-musl')
        run: bash scripts/ci/dist_runner_memory.sh prepare
      - name: Resolve feature selection
        id: features
        env:
          SELECTION: ${{ needs.detect.outputs.selection }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # The canonical registry (`cargo generate features`) is the single
          # source of truth for feature sets; install.sh and the packaging
          # surfaces consume the same resolution.
          FEATURES="$(cargo run --quiet -p xtask --bin generate -- features --selection "$SELECTION" --target "$TARGET")"
          echo "Resolved features: $FEATURES"
          echo "features=$FEATURES" >> "$GITHUB_OUTPUT"
          printf 'RELEASE_ARCHIVE_FEATURES=%s\n' "$FEATURES" >> "$GITHUB_ENV"
      - name: Build release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            BUILD_CMD="cross build"
          else
            BUILD_CMD="cargo build"
          fi
          if [ -n "${{ matrix.linker_env }}" ] && [ -n "${{ matrix.linker }}" ]; then
            export "${{ matrix.linker_env }}=${{ matrix.linker }}"
          fi
          $BUILD_CMD --release --locked --no-default-features \
            --features "$RELEASE_ARCHIVE_FEATURES" --target ${{ matrix.target }}
          binary="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          bytes="$(wc -c < "$binary" | tr -d '\r')"
          if [ "$RUNNER_OS" = "macOS" ]; then
            sha256="$(shasum -a 256 "$binary" | cut -d ' ' -f 1)"
          else
            sha256="$(sha256sum "$binary" | cut -d ' ' -f 1)"
          fi
          {
            echo "### ${{ matrix.target }}"
            echo
            echo "- Binary bytes: $bytes"
            echo "- SHA-256: $sha256"
            echo "- Resolved features: \`$RELEASE_ARCHIVE_FEATURES\`"
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'BINARY_SHA256=%s\n' "$sha256" >> "$GITHUB_ENV"
          printf 'BINARY_BYTES=%s\n' "$bytes" >> "$GITHUB_ENV"
      - name: Check binary size
        shell: bash
        run: bash scripts/ci/check_binary_size.sh "target/${{ matrix.target }}/release/${{ matrix.artifact }}" "${{ matrix.target }}"
        env:
          # Upstream caps the `dist` distribution at 80 MiB. This workflow
          # builds the `all` selection, which compiles every channel plus the
          # WASM plugin host — the upstream `:all-features` image binary is
          # ~87 MiB. The cap is raised, not removed, so a runaway build still
          # fails loudly.
          BINARY_SIZE_HARD_LIMIT: "209715200"
      - name: Build ZeroCode companion
        shell: bash
        run: ${{ matrix.use_cross && 'cross build' || 'cargo build' }} --release --locked -p zerocode --target ${{ matrix.target }}
      - name: Build ZeroRelay companion
        shell: bash
        run: ${{ matrix.use_cross && 'cross build' || 'cargo build' }} --release --locked -p zerorelay --target ${{ matrix.target }}
        continue-on-error: true
      - name: Package
        shell: bash
        run: bash scripts/ci/package_release_archive.sh "${{ matrix.target }}" "${{ matrix.artifact }}" "${{ matrix.ext }}" "$RUNNER_OS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zeroclaw-full-${{ matrix.target }}
          path: zeroclaw-${{ matrix.target }}.${{ matrix.ext }}
          retention-days: 7
      - name: Report and release owned Linux ARM64 build memory
        timeout-minutes: 5
        if: always() && runner.os == 'Linux' && (matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-musl')
        run: bash scripts/ci/dist_runner_memory.sh cleanup

  publish:
    name: Publish fork release
    needs: [detect, build]
    if: needs.detect.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Record the synced upstream version in this fork
        env:
          UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
          COMMIT: ${{ needs.detect.outputs.commit }}
          BUILD_TAG: ${{ needs.detect.outputs.build_tag }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git"
          git fetch --depth 1 upstream "$UPSTREAM_TAG"
          fetched="$(git rev-parse "FETCH_HEAD^{commit}")"
          if [ "$fetched" != "$COMMIT" ]; then
            echo "::error::Fetched $fetched but expected $COMMIT for $UPSTREAM_TAG"
            exit 1
          fi
          git checkout --detach "$COMMIT"

          # Record the synced upstream version two ways: a branch that names
          # the upstream version, and the release tag. The `build-` prefix
          # keeps both clear of upstream's `v*` tag triggers.
          #
          # The upstream commit cannot be pushed directly: the fetch is
          # shallow, so the commit's ancestors are missing and the remote
          # would reject the push as a graft. Instead, build one new commit
          # whose tree is exactly the upstream release tree and whose parent
          # is this fork's master. Only that commit, the tree, and the blobs
          # are new objects, so the push is self-contained.
          tree="$(git rev-parse "$COMMIT^{tree}")"
          parent="$(git rev-parse origin/master)"
          sync_message="$(printf 'sync: upstream %s (%s)\n\nSynced from %s at %s.\nUpstream commit: %s\nUpstream tree:   %s\n\nUnofficial fork. See UNOFFICIAL.md.\n' \
            "$UPSTREAM_TAG" "$COMMIT" "$UPSTREAM_REPO" "$UPSTREAM_TAG" "$COMMIT" "$tree")"
          sync_commit="$(git commit-tree "$tree" -p "$parent" -m "$sync_message")"

          git push origin "$sync_commit:refs/heads/upstream/$UPSTREAM_TAG"
          git push origin "$sync_commit:refs/tags/$BUILD_TAG"
          echo "sync_commit=$sync_commit" >> "$GITHUB_ENV"
          echo "### Synced" >> "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo "- Branch: \`upstream/$UPSTREAM_TAG\`"
            echo "- Tag: \`$BUILD_TAG\`"
            echo "- Upstream commit: \`$COMMIT\`"
            echo "- Upstream tree: \`$tree\`"
            echo "- Fork sync commit: \`$sync_commit\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: zeroclaw-full-*
          merge-multiple: true
      - name: Write release notes
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
          COMMIT: ${{ needs.detect.outputs.commit }}
          BUILD_TAG: ${{ needs.detect.outputs.build_tag }}
          SELECTION: ${{ needs.detect.outputs.selection }}
        run: |
          set -euo pipefail
          {
            echo "## ⚠️ Unofficial build"
            echo
            echo "This release is produced by an **unofficial, unaffiliated fork** of"
            echo "[\`zeroclaw-labs/zeroclaw\`](https://github.com/zeroclaw-labs/zeroclaw)."
            echo "It is not supported, endorsed, or monitored by ZeroClaw Labs."
            echo "For the official project see <https://github.com/zeroclaw-labs/zeroclaw>."
            echo
            echo "## What is different from the official release"
            echo
            echo "Same source, different feature selection. The official binaries use"
            echo "the \`dist\` selection, which omits the \`channels-full\` aggregate — so they"
            echo "ship **without** the QQ channel. This release uses the \`${SELECTION}\` selection,"
            echo "the same feature set as upstream's \`:all-features\` container image."
            echo
            echo "| | Official | This build |"
            echo "|---|---|---|"
            echo "| Selection | \`dist\` | \`${SELECTION}\` |"
            echo "| QQ channel (\`channel-qq\`) | not compiled in | compiled in |"
            echo "| Matrix / Lark / Signal / WhatsApp / WeChat | not compiled in | compiled in |"
            echo
            echo "## Provenance"
            echo
            echo "- Upstream version: \`${UPSTREAM_TAG}\`"
            echo "- Upstream commit: \`${COMMIT}\`"
            echo "- Upstream release: <https://github.com/zeroclaw-labs/zeroclaw/releases/tag/${UPSTREAM_TAG}>"
            echo "- Feature selection: \`${SELECTION}\`"
            echo
            echo "## Checksums"
            echo
            echo '```'
            sha256sum dist/* 2>/dev/null || shasum -a 256 dist/*
            echo '```'
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo "curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/${BUILD_TAG}/zeroclaw-x86_64-unknown-linux-gnu.tar.gz | tar xz"
            echo "install -m 0755 zeroclaw ~/.local/bin/zeroclaw"
            echo '```'
          } > notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TAG: ${{ needs.detect.outputs.build_tag }}
          UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$BUILD_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$BUILD_TAG" \
            --title "Full build ${UPSTREAM_TAG} (unofficial fork)" \
            --notes-file notes.md
          echo "Published $BUILD_TAG"
      - name: Summarize
        env:
          BUILD_TAG: ${{ needs.detect.outputs.build_tag }}
        run: |
          {
            echo "### Published"
            echo
            echo "- Release: \`$BUILD_TAG\`"
            echo "- Assets:"
            ls -l dist/ | sed 's/^/  /'
          } >> "$GITHUB_STEP_SUMMARY"
